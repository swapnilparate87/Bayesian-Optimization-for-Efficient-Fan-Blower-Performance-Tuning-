name: ML Pipeline CI

on:
  push:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: |
          pip install -r requirements.txt
          pip install dvc

      - name: Pull DVC data
        run: dvc pull

      - name: Run pipeline
        run: dvc repro